[package]
name = "kvass-shop"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.20", features = ["wav", "flac"] }
fontdue = "0.9"
rand = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

# Иконка exe/панели задач Windows: ресурс вшивается только при сборке под Windows.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
