name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "selftest_out/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Линковка тестового бинаря с debuginfo — самая дорогая часть прогона.
  # Отключаем debuginfo только для тестового профиля (на локальную сборку не влияет).
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    # Холодный прогон занял ~22 мин (почти весь прежний лимит в 30 мин).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check

      - name: cargo check
        run: cargo check --locked --all-targets

      - name: cargo test
        run: cargo test --locked
